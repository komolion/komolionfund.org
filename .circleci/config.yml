version: 2
jobs:
  build:
    docker:
      - image: cimg/ruby:3.3.4-node
    working_directory: ~/deployment
    steps:
      - checkout
      - run:
          name: Install dependencies and build project
          command: |
            gem install bundler -v 2.5.11
            make build
      - persist_to_workspace:
          root: .
          paths: _site/
  deploy:
    docker:
      - image: circleci/python
    working_directory: ~/deployment
    steps:
      - run:
          name: Plan deployment
          command: |
            circleci run release plan "${CIRCLE_JOB}" \
              --environment-name="default" \
              --component-name="${CIRCLE_PROJECT_REPONAME}" \
              --target-version="1.0.${CIRCLE_BUILD_NUM}-${CIRCLE_SHA1:0:7}"
      - run:
          name: Install awscli
          command: sudo pip install awscli
      - attach_workspace:
          at: ~/deployment
      - run:
          name: Deploy to S3
          command: aws s3 sync ./_site/ s3://www.komolionfund.org/ --delete
      - run:
          name: Invalidate Cache
          command: |
            aws cloudfront create-invalidation --distribution-id E19RRXFFJ1N65H --paths "/assets/css/*" "/projects/*" "/give.html" "/index.html" "/sitemap.xml" "/story.html" "/team.html"
            aws cloudfront create-invalidation --distribution-id EU7GYR4PPCDYO --paths "/assets/css/*" "/projects/*" "/give.html" "/index.html" "/sitemap.xml" "/story.html" "/team.html"
      - run:
          name: Update deployment status to running
          command: circleci run release update "${CIRCLE_JOB}" --status=RUNNING
      - run:
          name: Update deployment status to success
          command: circleci run release update "${CIRCLE_JOB}" --status=SUCCESS
          when: on_success
      - run:
          name: Update deployment status to failed
          command: circleci run release update "${CIRCLE_JOB}" --status=FAILED
          when: on_fail

workflows:
  version: 2
  build-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: master
